name: monitor

# The news monitor: every ~15 minutes, pull new stories from the news feeds, Google News topic searches,
# SEC/CFTC/Fed press, SEC 8-Ks and your watchlist on X (only new posts are billed), group the same story
# across outlets, and ping Discord about priority items as they appear. No AI, so it's quick and free.
# ⏸ Switched off (README → Switched off): the schedule is paused. Un-comment it to turn it back on.
on:
  # schedule:
  #   - cron: "4,19,34,49 * * * *"
  workflow_dispatch: {}

concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      XCP_LIVE: ${{ vars.XCP_LIVE }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      PANEL_URL: ${{ vars.PANEL_URL }}
    steps:
      - name: Secrets configured?
        id: cfg
        run: |
          if [ "$XCP_LIVE" != "1" ]; then
            echo "::notice::X Control Panel is switched off (Actions variable XCP_LIVE is not 1). Skipping."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$DATABASE_URL" ]; then
            echo "::notice::DATABASE_URL secret not set yet. Skipping."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'

      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-monitor.txt

      - name: Install dependencies
        if: steps.cfg.outputs.ok == 'true'
        run: pip install -q -r requirements-monitor.txt

      - name: Monitor
        if: steps.cfg.outputs.ok == 'true'
        run: python -m jobs.monitor
