# Defaults. Anything you change in the panel's Control Room is saved to the
# database and overrides these values (new keys added here still flow through).

account:
  handle: ""          # your X handle, without the @
  premium: true       # long posts allowed; the first 280 chars still carry the hook

# All times are America/New_York (EST/EDT handled automatically).
# run_at = when the agent starts; post_at = when you plan to post.
slots:
  premarket:
    label: "☀️ Pre-market"
    run_at: "07:05"
    post_at: "08:00"
    days: [mon, tue, wed, thu, fri]
    lane: btc
    stories: 3
    variants: 3
  ai_noon:
    label: "🤖 AI ideas"
    run_at: "11:20"
    post_at: "12:00"
    days: [mon, tue, wed, thu, fri, sat, sun]
    lane: ai
    stories: 3
    variants: 2
    optional: true
  midday:
    label: "🕜 Midday"
    run_at: "12:50"
    post_at: "13:30"
    days: [mon, tue, wed, thu, fri]
    lane: btc
    stories: 3
    variants: 3
  friday_close:
    label: "🔔 Friday close"
    run_at: "16:10"
    post_at: "16:30"
    days: [fri]
    lane: btc
    stories: 2
    variants: 3

# Showcase posts: the X images from your Digital Credit Report (digital-exposure repo).
# The showcase workflow renders each panel with the same code as the page's "Download X image"
# button, audits it, and only then drafts the post. Regular drafts stay as backups.
# start/deadline = watch window (ET). Monday moves to Tuesday after an EDGAR Monday holiday.
digital_exposure:
  repo: bobat2121-lgtm/digital-exposure
  branch: main
  app_url: https://digital-credit-report.streamlit.app
  feed_url: https://capital-report.alatimore06370.workers.dev/api/filings
  poll_seconds: 120          # cheap readiness check (8-K feed / clock)
  render_every_seconds: 300  # full render + audit at most this often
  friday_settle_minutes: 10  # let the 4:00 pm closes settle before accepting Friday data
  panels:
    monday:
      title: "The Accretion Ledger"
      day: mon
      slot: premarket
      start: "07:40"
      nudge: "09:00"      # one "still waiting" ping if not ready by then
      deadline: "11:30"
      post: "as soon as it's ready (usually 8:10-8:30)"
    wednesday:
      title: "The Coupon Sheet"
      day: wed
      slot: midday
      start: "12:30"
      nudge: "13:15"
      deadline: "15:00"
      post: "13:30"
    friday:
      title: "The Closing Mark"
      day: fri
      slot: friday_close
      start: "16:05"
      nudge: "16:25"
      deadline: "18:30"
      post: "16:30"

# Calendar fills itself nightly: FOMC (Fed), GDP/PCE (BEA), STRC dates (strategy.com), MSTR/ASST
# earnings (Nasdaq), and digital-exposure's curated STRC/SATA events. CPI and jobs dates come from BLS,
# which only answers requests that include a contact email: bls_contact: true uses your SEC_USER_AGENT.
calendar:
  auto: true
  days_ahead: 60
  bls_contact: false

jobs:
  nightly: {run_at: "21:30", days: [mon, tue, wed, thu, fri, sat, sun]}
  weekly: {run_at: "17:00", days: [sun]}

# Share of what you actually post (rolling 7 days). Must sum to 100.
targets:
  pillars: {digital_credit: 35, bitcoin: 30, macro: 15, ai: 20}
  tones: {analytical: 50, timely: 30, funny: 20}

limits:
  x_max_posts_per_run: 100     # hard cap on X API post reads per agent run
  x_daily_post_cap: 200        # hard cap per day (~$1 at $0.005/post)
  x_monthly_post_cap: 4000     # hard cap per month (~$20); manual style refreshes excluded
  x_watchlist_reserve_daily: 60     # of the daily cap, kept for your watchlist accounts (keyword searches can't use it)
  x_watchlist_reserve_monthly: 1200 # same for the monthly cap (~25 posts/day from your 7 accounts)
  items_to_llm: 120            # how many scanned items the writer sees per slot
  item_text_chars: 600
  include_watchlist_replies: false

# Style refresh (Control Room -> Run now -> 📚 Style refresh). X reads ≈ $0.005 each.
style:
  posts_per_account: 100      # latest original posts per watchlist account
  replies_reposts_per_account: 100  # extra latest items incl. replies/reposts per account
  own_posts_max: 1000         # cap on your own posts pulled into your voice library
  include_replies: true       # replies: your voice + reply craft from admired accounts
  include_reposts: true       # reposts: saved as 'amplified' signals only (never voice)

market:
  tickers: [MSTR, STRC, STRF, STRK, STRD, ASST, SATA, IBIT, "^TNX", "DX-Y.NYB", "^GSPC", "GC=F"]
  # Holdings and dividend rates fill automatically (8-K feed, strategy.com, strive.com) on every snapshot.
  # The values below are the fallback if a source fails, or what's used when auto_inputs is off.
  auto_inputs: true
  mstr_btc_holdings: null        # BTC held by Strategy (update after the Monday 8-K)
  asst_btc_holdings: null        # BTC held by Strive
  strc_annual_rate_pct: null     # STRC dividend rate, reset monthly
  sata_annual_rate_pct: 13.0     # SATA dividend rate (13.00% per May 2026 8-K; verify)
  rates_as_of: "2026-05"

# What the agents do at each slot. monitor = brief you on what's surfacing and you write the posts
# (Monitor page). drafts = they also write post drafts (the original mode; switch back any time).
writer:
  mode: monitor

# Discord: only these alert kinds are sent. Everything else stays in the panel (Control Room shows what was held).
# Kinds: showcase_ready, showcase_status, news_priority, watchlist, desk, drafts, weekly, style, errors, test
alerts:
  discord: [showcase_ready, test]   # showcase_ready = a Digital Credit Report panel is live for its post time

# The news monitor runs every ~15 minutes (.github/workflows/monitor.yml): feeds, Google News, SEC 8-Ks, and
# your watchlist on X (only new posts are billed). It flags priority stories on the Monitor page; Discord pings for
# news are off unless alerts.discord includes news_priority / watchlist.
monitor:
  window_hours: 48            # how far back feeds are read
  x_watchlist: true           # poll your watchlist accounts on every monitor run
  ping: true
  ping_max_per_hour: 5
  quiet_hours: ["23:00", "06:30"]   # no pings overnight (ET); they show in the morning desk brief
  priority_pillars: [digital_credit, stablecoins, legislation]
  breaking_words: [passes, passed, "signed into law", signs, approves, approved, rejects, rejected, vote,
                   hack, exploit, depeg, ruling, lawsuit, sues, charges, halts, emergency, "all-time high",
                   "record high", launches, files for, acquires, acquired]
  trending_sources: 3         # same story from this many outlets within 3 hours = priority
  ping_fresh_hours: 3         # only ping stories published in the last few hours (not old news seen late)
  # Off your lanes unless the story also hits digital credit, stablecoins or legislation.
  offlane_words: [XRP, Ripple, Solana, Dogecoin, DOGE, Cardano, memecoin, memecoins, "meme coin", Shiba, PEPE,
                  Litecoin, Avalanche, Polkadot, TRON, Toncoin, BNB, Hyperliquid, HYPE, Sui, Aptos, Pi Network]
  watchlist_digest_minutes: 30  # one Discord message with your accounts' new posts, at most this often (0 = off)
  idea_min_engagement: 100     # idea feed: posts from accounts outside your 7 need this much traction (likes + 2×reposts + 3×quotes)

# Voice mode. "classic" = the original style mix. "v2" = more of your own posts and only the admired accounts'
# reasoning (no templates), plus the robot check (em dashes, AI phrases, same-shape lines). Control Room →
# Voice & rules → "Make the draft live" switches both on.
voice:
  style_mode: classic
  robot_check: false

llm:
  backend: codex      # codex (your ChatGPT account via Codex CLI) | mock (offline testing)
  codex_model: ""     # blank = Codex default model (e.g. gpt-6-sol, gpt-6-astra, gpt-6-luna)
  reasoning_effort: "" # blank = model default; low | medium | high | xhigh
